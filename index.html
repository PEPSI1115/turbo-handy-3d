<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>TURBO HANDY — 3D 모델 뷰어</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: #020617;
      color: #f1f5f9;
      font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
      overflow: hidden;
    }

    #app {
      display: flex;
      flex-direction: column;
      height: 100dvh;
      height: 100vh;
    }

    /* ── Header ── */
    #header {
      padding: 10px 16px 6px;
      background: #0f172a;
      border-bottom: 1px solid #1e293b;
      flex-shrink: 0;
    }
    .title-row { display: flex; align-items: center; gap: 8px; }
    h1 {
      font-size: 1.25rem;
      font-weight: 800;
      background: linear-gradient(90deg, #60a5fa, #a78bfa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .rev {
      font-size: 0.6rem;
      background: #1e293b;
      color: #94a3b8;
      padding: 2px 6px;
      border-radius: 4px;
      letter-spacing: 0.08em;
      font-weight: 700;
    }
    .subtitle { color: #475569; font-size: 0.7rem; margin-top: 2px; }

    /* ── View controls ── */
    #view-controls {
      display: flex;
      gap: 6px;
      padding: 7px 16px;
      background: #0a1628;
      border-bottom: 1px solid #1e293b;
      flex-shrink: 0;
    }
    .vbtn {
      background: #1e293b;
      border: 1px solid #334155;
      color: #94a3b8;
      padding: 5px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.78rem;
      font-weight: 600;
      transition: all 0.15s;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }
    .vbtn.active, .vbtn:hover {
      background: #1e3a8a;
      border-color: #60a5fa;
      color: #60a5fa;
    }

    /* ── Main layout ── */
    #main {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 300px;
      min-height: 0;
    }

    /* ── Canvas ── */
    #canvas-wrap {
      position: relative;
      overflow: hidden;
      min-height: 0;
    }
    canvas {
      display: block;
      width: 100% !important;
      height: 100% !important;
      touch-action: none;
    }
    #hint {
      position: absolute;
      bottom: 8px;
      left: 50%;
      transform: translateX(-50%);
      color: #334155;
      font-size: 0.66rem;
      white-space: nowrap;
      pointer-events: none;
      user-select: none;
    }

    /* ── Sidebar ── */
    #sidebar {
      background: #070f1d;
      border-left: 1px solid #1e293b;
      overflow-y: auto;
      padding: 12px 10px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      min-height: 0;
    }
    .sec-title {
      font-size: 0.6rem;
      font-weight: 700;
      letter-spacing: 0.14em;
      color: #475569;
      text-transform: uppercase;
      margin-bottom: 7px;
    }

    /* Part list */
    #part-list { display: flex; flex-direction: column; gap: 3px; }
    .pbtn {
      display: flex;
      align-items: center;
      gap: 8px;
      background: transparent;
      border: 1px solid #1e293b;
      color: #94a3b8;
      padding: 6px 10px;
      border-radius: 7px;
      cursor: pointer;
      text-align: left;
      font-size: 0.78rem;
      font-weight: 500;
      width: 100%;
      transition: all 0.12s;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }
    .pbtn.active, .pbtn:hover {
      border-color: var(--c);
      color: #f1f5f9;
      background: #1e293b44;
    }
    .pdot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--c);
      flex-shrink: 0;
    }

    /* Detail card */
    #detail {
      display: none;
      background: #0f172a;
      border-radius: 10px;
      padding: 11px;
      border: 1px solid #1e293b;
    }
    #detail.show { display: block; }
    .dheader {
      display: flex;
      align-items: center;
      gap: 7px;
      border-left: 3px solid var(--dc);
      padding-left: 8px;
      margin-bottom: 8px;
    }
    .ddot { width: 9px; height: 9px; border-radius: 50%; background: var(--dc); flex-shrink: 0; }
    .dname { font-size: 0.88rem; font-weight: 700; color: #f1f5f9; }
    .ddesc { font-size: 0.76rem; color: #94a3b8; line-height: 1.6; margin-bottom: 9px; }
    .dspec { display: flex; gap: 6px; align-items: baseline; }
    .slabel { font-size: 0.6rem; font-weight: 700; letter-spacing: 0.1em; color: #475569; text-transform: uppercase; flex-shrink: 0; }
    .sval { font-size: 0.72rem; color: #60a5fa; font-family: monospace; }

    /* Mode table */
    #mode-table { display: flex; flex-direction: column; gap: 5px; }
    .mrow {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      background: #0f172a;
      border-radius: 7px;
      padding: 7px 9px;
      border: 1px solid #1e293b;
    }
    .mtag {
      font-size: 0.57rem;
      font-weight: 800;
      letter-spacing: 0.05em;
      padding: 2px 5px;
      border-radius: 4px;
      border: 1px solid;
      flex-shrink: 0;
      margin-top: 1px;
    }
    .mact { font-size: 0.74rem; color: #cbd5e1; font-weight: 600; }
    .mtrig { font-size: 0.66rem; color: #475569; margin-top: 2px; }

    ::-webkit-scrollbar { width: 3px; }
    ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 2px; }

    /* ── Mobile ── */
    @media (max-width: 680px) {
      #main {
        grid-template-columns: 1fr;
        grid-template-rows: 1fr auto;
      }
      #canvas-wrap { min-height: 52vw; }
      #sidebar {
        border-left: none;
        border-top: 1px solid #1e293b;
        max-height: 42dvh;
        max-height: 42vh;
        overflow-y: auto;
      }
    }
  </style>
</head>
<body>
<div id="app">
  <div id="header">
    <div class="title-row">
      <h1>TURBO HANDY</h1>
      <span class="rev">REV.03</span>
    </div>
    <div class="subtitle">Sound-First 설계 &middot; 터보 stututu 손선풍기 &middot; 인터랙티브 3D 모델</div>
  </div>

  <div id="view-controls">
    <button class="vbtn active" data-mode="exterior">외관</button>
    <button class="vbtn" data-mode="cross">단면</button>
    <button class="vbtn" data-mode="exploded">분해도</button>
  </div>

  <div id="main">
    <div id="canvas-wrap">
      <canvas id="c"></canvas>
      <div id="hint">드래그: 회전 &nbsp;&middot;&nbsp; 핀치: 줌 &nbsp;&middot;&nbsp; 탭: 부품 정보</div>
    </div>

    <div id="sidebar">
      <div>
        <div class="sec-title">부품 목록</div>
        <div id="part-list"></div>
      </div>
      <div id="detail">
        <div class="dheader"><div class="ddot"></div><div class="dname"></div></div>
        <div class="ddesc"></div>
        <div class="dspec"><span class="slabel">사양</span><span class="sval"></span></div>
      </div>
      <div>
        <div class="sec-title">모드 시스템</div>
        <div id="mode-table"></div>
      </div>
    </div>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ─── Data ────────────────────────────────────────────────────────────────────
const PARTS = [
  { id:'impeller',  name:'임펠러 (BLDC)',        color:'#60a5fa',
    desc:'Φ40mm 8블레이드 BLDC 임펠러. 고속 회전으로 공기를 생성하고 ~2,400Hz BPF 휘슬 톤을 발생. ESC를 통해 트리거 각도에 비례하여 PWM 제어.',
    spec:'A2212 2450KV · 최대 ~25,000RPM' },
  { id:'chopper',   name:'Chopper 디스크 (N20)', color:'#f59e0b',
    desc:'N20 모터에 장착된 3슬릿 디스크. 임펠러 앞에서 공기를 15Hz로 끊어 "stututu" 리듬 생성. 슬릿 수 × RPM ÷ 60 = Hz.',
    spec:'N20 모터 · 3슬릿 · 300RPM → 15Hz' },
  { id:'plenum',    name:'Plenum 챔버',           color:'#34d399',
    desc:'~30cm³ 밀폐 공간. Chopper가 공기를 막으면 압력 충전 → 열리면 폭발 방출. 매 펄스마다 버스트 텍스처 생성.',
    spec:'용량 ~30cm³' },
  { id:'helmholtz', name:'헬름홀츠 공명 캐비티',   color:'#a78bfa',
    desc:'V=20cm³ 외벽 캐비티. BPF 톤(~2,400Hz)을 +10~15dB 증폭. PVC neck 길이로 공명 주파수 튜닝.',
    spec:'V=20cm³ · 증폭 +10~15dB' },
  { id:'battery',   name:'배터리 (LiPo)',          color:'#f87171',
    desc:'7.4V 450mAh 2S LiPo. 그립 하단 내장. USB-C 충전 포트 (8.4V). IPX4 방수 처리 필수.',
    spec:'7.4V 450mAh 2S · JST · USB-C' },
  { id:'mcu',       name:'MCU + ESC',             color:'#fb923c',
    desc:'ATtiny85(양산) / Arduino Nano(프로토). 트리거 → ESC PWM + Chopper PWM 동기 제어. Chopper 닫힘 시 임펠러 PWM 10~15% 낮춰 BPF FM 변조.',
    spec:'ATtiny85 · 40A ESC' },
  { id:'trigger',   name:'아날로그 트리거',          color:'#e879f9',
    desc:'PS5 L2 방식. 10kΩ 가변저항으로 눌림 깊이 → RPM 제어. 잠금 버튼으로 트리거 고정 → 선풍기 모드.',
    spec:'10kΩ 가변저항 · 잠금 버튼 별도' },
  { id:'oled',      name:'OLED 디스플레이',         color:'#38bdf8',
    desc:'0.96" I2C OLED. RPM / Chopper Hz / 배터리 잔량 / 현재 모드 표시. 설정 탭에서 Chopper Hz 조절.',
    spec:'0.96" · I2C · 128×64px' },
  { id:'intake',    name:'흡기 콘 + 허니컴 그릴',    color:'#94a3b8',
    desc:'이중 안전 구조. 흡기 콘(1차) + 허니컴 그릴(2차)로 손가락 접촉 방지. 바요넷 마운트 탈착.',
    spec:'바요넷 마운트 · IPX4 방수' },
];

const MODES = [
  { tag:'FAN MODE',  action:'Chopper OFF · 중간 RPM',        trigger:'트리거 + 잠금',       color:'#60a5fa' },
  { tag:'SPOOL UP',  action:'RPM 서서히 상승 · BPF 휘슬',     trigger:'트리거 천천히',        color:'#34d399' },
  { tag:'ANTI-LAG',  action:'고RPM + Chopper 15Hz + FM 변조', trigger:'Anti-Lag 버튼 ON',    color:'#f59e0b' },
  { tag:'BOV BURST', action:'단발 버스트 + RPM 급강하',        trigger:'트리거 급격히 해제',   color:'#f87171' },
];

// ─── Build sidebar UI ─────────────────────────────────────────────────────────
const partListEl  = document.getElementById('part-list');
const detailEl    = document.getElementById('detail');
const modeTableEl = document.getElementById('mode-table');

PARTS.forEach(p => {
  const btn = document.createElement('button');
  btn.className = 'pbtn';
  btn.dataset.id = p.id;
  btn.style.setProperty('--c', p.color);
  btn.innerHTML = `<span class="pdot"></span>${p.name}`;
  btn.addEventListener('click', () => selectPart(p.id));
  partListEl.appendChild(btn);
});

MODES.forEach(m => {
  const row = document.createElement('div');
  row.className = 'mrow';
  row.innerHTML =
    `<span class="mtag" style="background:${m.color}22;color:${m.color};border-color:${m.color}55">${m.tag}</span>` +
    `<div><div class="mact">${m.action}</div><div class="mtrig">${m.trigger}</div></div>`;
  modeTableEl.appendChild(row);
});

// ─── Three.js ─────────────────────────────────────────────────────────────────
const canvas = document.getElementById('c');
const wrap   = document.getElementById('canvas-wrap');

const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setClearColor(0x020617);
renderer.shadowMap.enabled = true;
renderer.localClippingEnabled = true;

const scene  = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 100);
camera.position.set(0, 1.8, 6);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 2.5;
controls.maxDistance = 11;

scene.add(new THREE.AmbientLight(0xffffff, 0.45));
const sun = new THREE.DirectionalLight(0xffffff, 1.3);
sun.position.set(5, 8, 5);
sun.castShadow = true;
scene.add(sun);
const fill = new THREE.DirectionalLight(0x4080ff, 0.3);
fill.position.set(-5, -3, -5);
scene.add(fill);
const rim = new THREE.PointLight(0x60a5fa, 0.6, 10);
rim.position.set(0, 2.5, 2);
scene.add(rim);

// ─── State ────────────────────────────────────────────────────────────────────
let selectedId = null;
let viewMode   = 'exterior';

const clipPlane = new THREE.Plane(new THREE.Vector3(0, 0, -1), 0.02);

// ─── Part registry ────────────────────────────────────────────────────────────
const registry = {};
function reg(id, group, meshes, ex) {
  registry[id] = { group, meshes, explodeVec: ex };
  scene.add(group);
}

// ─── Material helper ──────────────────────────────────────────────────────────
function mat(hex, opts={}) {
  return new THREE.MeshStandardMaterial({
    color: new THREE.Color(hex),
    metalness: opts.m ?? 0.4,
    roughness: opts.r ?? 0.5,
    transparent: !!opts.op,
    opacity: opts.op ?? 1,
    side: opts.side ?? THREE.FrontSide,
    wireframe: !!opts.wire,
  });
}

// ─── Housing (static) ────────────────────────────────────────────────────────
{
  const g = new THREE.Group();

  const barrel = new THREE.Mesh(
    new THREE.CylinderGeometry(0.54, 0.54, 1.9, 40),
    mat('#1e293b', { m:0.55, r:0.35 })
  );
  barrel.rotation.z = Math.PI/2;
  barrel.position.x = 0.85;
  g.add(barrel);

  const grip = new THREE.Mesh(
    new THREE.CylinderGeometry(0.27, 0.22, 1.1, 24),
    mat('#0c1526', { m:0.3, r:0.75 })
  );
  grip.position.set(-0.48, -0.55, 0);
  grip.rotation.z = Math.PI/6;
  g.add(grip);

  const conn = new THREE.Mesh(
    new THREE.BoxGeometry(0.62, 0.54, 0.52),
    mat('#1e293b', { m:0.45, r:0.5 })
  );
  conn.position.set(-0.1, -0.08, 0);
  g.add(conn);

  const alBtn = new THREE.Mesh(
    new THREE.CylinderGeometry(0.06, 0.06, 0.09, 12),
    mat('#f59e0b', { m:0.5, r:0.3 })
  );
  alBtn.rotation.x = Math.PI/2;
  alBtn.position.set(0.5, 0.57, 0.4);
  g.add(alBtn);

  const lkBtn = new THREE.Mesh(
    new THREE.CylinderGeometry(0.05, 0.05, 0.09, 12),
    mat('#475569', { m:0.5, r:0.4 })
  );
  lkBtn.rotation.x = Math.PI/2;
  lkBtn.position.set(-0.05, 0.57, 0.4);
  g.add(lkBtn);

  scene.add(g);
}

// ─── Intake grill ─────────────────────────────────────────────────────────────
{
  const g = new THREE.Group();
  const c = '#94a3b8';

  const ring = new THREE.Mesh(
    new THREE.TorusGeometry(0.52, 0.055, 16, 40),
    mat(c, { m:0.65, r:0.3 })
  );
  ring.rotation.y = Math.PI/2;
  ring.position.x = 1.93;
  g.add(ring);

  const grill = new THREE.Mesh(
    new THREE.CircleGeometry(0.47, 6),
    mat(c, { wire:true, m:0.4 })
  );
  grill.rotation.y = Math.PI/2;
  grill.position.x = 1.94;
  g.add(grill);

  const cone = new THREE.Mesh(
    new THREE.ConeGeometry(0.52, 0.44, 32, 1, true),
    mat(c, { op:0.6, side:THREE.DoubleSide })
  );
  cone.rotation.z = -Math.PI/2;
  cone.position.x = 2.15;
  g.add(cone);

  reg('intake', g, [ring, grill, cone], new THREE.Vector3(-1.6, 0, 0));
}

// ─── Impeller ─────────────────────────────────────────────────────────────────
let impellerSpin;
{
  const wrapper = new THREE.Group();
  impellerSpin = new THREE.Group();
  impellerSpin.position.x = 1.4;
  wrapper.add(impellerSpin);

  const c = '#60a5fa';
  const meshes = [];

  const hub = new THREE.Mesh(
    new THREE.CylinderGeometry(0.11, 0.11, 0.32, 16),
    mat(c, { m:0.85, r:0.2 })
  );
  hub.rotation.z = Math.PI/2;
  impellerSpin.add(hub);
  meshes.push(hub);

  for (let i = 0; i < 8; i++) {
    const ang = (i / 8) * Math.PI * 2;
    const blade = new THREE.Mesh(
      new THREE.BoxGeometry(0.22, 0.055, 0.19),
      mat(c, { m:0.7, r:0.25, op:0.92 })
    );
    blade.position.set(0, Math.cos(ang) * 0.21, Math.sin(ang) * 0.21);
    blade.rotation.x = ang;
    impellerSpin.add(blade);
    meshes.push(blade);
  }

  reg('impeller', wrapper, meshes, new THREE.Vector3(-0.9, 0, 0));
}

// ─── Chopper disk ────────────────────────────────────────────────────────────
let chopperSpin;
{
  const wrapper = new THREE.Group();
  chopperSpin = new THREE.Group();
  chopperSpin.position.x = 0.9;
  wrapper.add(chopperSpin);

  const c = '#f59e0b';
  const meshes = [];

  const disk = new THREE.Mesh(
    new THREE.CylinderGeometry(0.38, 0.38, 0.055, 36),
    mat(c, { m:0.5, r:0.3 })
  );
  disk.rotation.z = Math.PI/2;
  chopperSpin.add(disk);
  meshes.push(disk);

  for (let i = 0; i < 3; i++) {
    const ang = (i / 3) * Math.PI * 2;
    const slit = new THREE.Mesh(
      new THREE.BoxGeometry(0.07, 0.16, 0.14),
      mat('#020617', { m:0.1, r:0.9 })
    );
    slit.position.set(0, Math.cos(ang) * 0.22, Math.sin(ang) * 0.22);
    chopperSpin.add(slit);
  }

  const n20 = new THREE.Mesh(
    new THREE.CylinderGeometry(0.065, 0.065, 0.35, 12),
    mat(c, { m:0.6, r:0.35 })
  );
  n20.position.set(0, -0.31, 0);
  chopperSpin.add(n20);
  meshes.push(n20);

  reg('chopper', wrapper, meshes, new THREE.Vector3(-0.3, 0, 0));
}

// ─── Plenum chamber ───────────────────────────────────────────────────────────
{
  const g = new THREE.Group();
  const mesh = new THREE.Mesh(
    new THREE.CylinderGeometry(0.5, 0.5, 0.68, 36),
    mat('#34d399', { m:0.25, r:0.6, op:0.38, side:THREE.DoubleSide })
  );
  mesh.rotation.z = Math.PI/2;
  mesh.position.x = 0.35;
  g.add(mesh);
  reg('plenum', g, [mesh], new THREE.Vector3(0.35, 0, 0));
}

// ─── Helmholtz cavity ────────────────────────────────────────────────────────
{
  const g = new THREE.Group();
  const c = '#a78bfa';

  const box = new THREE.Mesh(
    new THREE.BoxGeometry(0.64, 0.2, 0.42),
    mat(c, { op:0.78 })
  );
  box.position.set(-0.1, 0.64, 0);
  g.add(box);

  const neck = new THREE.Mesh(
    new THREE.CylinderGeometry(0.04, 0.04, 0.15, 12),
    mat(c)
  );
  neck.position.set(-0.1, 0.52, 0);
  g.add(neck);

  reg('helmholtz', g, [box, neck], new THREE.Vector3(0, 1.3, 0));
}

// ─── Battery ──────────────────────────────────────────────────────────────────
{
  const g = new THREE.Group();

  const batt = new THREE.Mesh(
    new THREE.BoxGeometry(0.72, 0.23, 0.3),
    mat('#f87171')
  );
  batt.position.set(-0.5, -0.6, 0);
  g.add(batt);

  const usb = new THREE.Mesh(
    new THREE.BoxGeometry(0.04, 0.075, 0.14),
    mat('#475569', { m:0.8, r:0.2 })
  );
  usb.position.set(-0.87, -0.6, 0);
  g.add(usb);

  reg('battery', g, [batt], new THREE.Vector3(0, -1.3, 0));
}

// ─── MCU + ESC ────────────────────────────────────────────────────────────────
{
  const g = new THREE.Group();

  const pcb = new THREE.Mesh(
    new THREE.BoxGeometry(0.46, 0.065, 0.28),

  reg('mcu', g, [pcb, chip], new THREE.Vector3(0, -0.9, 1.1));
}

// ─── Raycaster ───────────────────────────────────────────────────────────────
const raycaster = new THREE.Raycaster();
const ndc = new THREE.Vector2();

let pointerDownPos = null;
canvas.addEventListener('pointerdown', e => {
  pointerDownPos = { x: e.clientX, y: e.clientY };
});
canvas.addEventListener('pointerup', e => {
  if (!pointerDownPos) return;
  const dx = e.clientX - pointerDownPos.x;
  const dy = e.clientY - pointerDownPos.y;
  if (Math.hypot(dx, dy) < 8) {
    const r = canvas.getBoundingClientRect();
    ndc.set(
      ((e.clientX - r.left) / r.width)  * 2 - 1,
      -((e.clientY - r.top)  / r.height) * 2 + 1
    );
    raycaster.setFromCamera(ndc, camera);
    const allMeshes = Object.values(registry).flatMap(r => r.meshes);
    const hits = raycaster.intersectObjects(allMeshes);
    if (hits.length) {
      const hitUuid = hits[0].object.uuid;
      const found = PARTS.find(p => registry[p.id]?.meshes.some(m => m.uuid === hitUuid));
      if (found) selectPart(found.id);
    }
  }
  pointerDownPos = null;
});

// ─── Selection ───────────────────────────────────────────────────────────────
function selectPart(id) {
  selectedId = selectedId === id ? null : id;
  updateUI();
  updateColors();
}

function updateUI() {
  document.querySelectorAll('.pbtn').forEach(b =>
    b.classList.toggle('active', b.dataset.id === selectedId)
  );
  if (selectedId) {
    const p = PARTS.find(x => x.id === selectedId);
    detailEl.style.setProperty('--dc', p.color);
    detailEl.classList.add('show');
    detailEl.querySelector('.ddot').style.background = p.color;
    detailEl.querySelector('.dname').textContent = p.name;
    detailEl.querySelector('.ddesc').textContent = p.desc;
    detailEl.querySelector('.sval').textContent  = p.spec;
    detailEl.scrollIntoView({ behavior:'smooth', block:'nearest' });
  } else {
    detailEl.classList.remove('show');
  }
}

function updateColors() {
  PARTS.forEach(p => {
    const entry = registry[p.id];
    if (!entry) return;
    const dim = selectedId && selectedId !== p.id;
    entry.meshes.forEach(m => {
      if (m.material.wireframe) return;
      m.material.color.set(dim ? '#1a2540' : p.color);
      if (m.material.emissive)
        m.material.emissiveIntensity = dim ? 0 : (selectedId === p.id ? 1.4 : 0.65);
    });
  });
}

// ─── View mode ───────────────────────────────────────────────────────────────
document.querySelectorAll('.vbtn').forEach(btn => {
  btn.addEventListener('click', () => {
    viewMode = btn.dataset.mode;
    document.querySelectorAll('.vbtn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    renderer.clippingPlanes = viewMode === 'cross' ? [clipPlane] : [];
  });
});

// ─── Explode lerp ─────────────────────────────────────────────────────────────
const EX = 1.5;
function tickExplode() {
  const t = viewMode === 'exploded' ? 1 : 0;
  PARTS.forEach(p => {
    const entry = registry[p.id];
    if (!entry) return;
    const { group, explodeVec: v } = entry;
    group.position.x += (v.x * EX * t - group.position.x) * 0.09;
    group.position.y += (v.y * EX * t - group.position.y) * 0.09;
    group.position.z += (v.z * EX * t - group.position.z) * 0.09;
  });
}

// ─── Resize ──────────────────────────────────────────────────────────────────
function resize() {
  const w = wrap.clientWidth, h = wrap.clientHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
resize();
window.addEventListener('resize', resize);

// ─── Animation loop ───────────────────────────────────────────────────────────
const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const dt = clock.getDelta();
  const t  = clock.getElapsedTime();

  controls.update();
  impellerSpin.rotation.x += dt * (selectedId === 'impeller' ? 14 : 6);
  chopperSpin.rotation.x  += dt * 2.2;
  screenMat.emissiveIntensity = 0.45 + Math.sin(t * 1.8) * 0.22;

  tickExplode();
  renderer.render(scene, camera);
}
animate();
</script>
