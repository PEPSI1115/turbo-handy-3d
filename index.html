<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>TURBO HANDY — 3D 모델 뷰어</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: #020617; color: #f1f5f9; font-family: system-ui, -apple-system, sans-serif; overflow: hidden; }
    #app { display: flex; flex-direction: column; height: 100dvh; height: 100vh; }
    #header { padding: 10px 16px 6px; background: #0f172a; border-bottom: 1px solid #1e293b; flex-shrink: 0; }
    .title-row { display: flex; align-items: center; gap: 8px; }
    h1 { font-size: 1.25rem; font-weight: 800; background: linear-gradient(90deg, #60a5fa, #a78bfa); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
    .rev { font-size: 0.6rem; background: #1e293b; color: #94a3b8; padding: 2px 6px; border-radius: 4px; letter-spacing: .08em; font-weight: 700; }
    .subtitle { color: #475569; font-size: .7rem; margin-top: 2px; }
    #view-controls { display: flex; gap: 6px; padding: 7px 16px; background: #0a1628; border-bottom: 1px solid #1e293b; flex-shrink: 0; }
    .vbtn { background: #1e293b; border: 1px solid #334155; color: #94a3b8; padding: 5px 14px; border-radius: 6px; cursor: pointer; font-size: .78rem; font-weight: 600; transition: all .15s; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
    .vbtn.active, .vbtn:hover { background: #1e3a8a; border-color: #60a5fa; color: #60a5fa; }
    #main { flex: 1; display: grid; grid-template-columns: 1fr 300px; min-height: 0; }
    #canvas-wrap { position: relative; overflow: hidden; }
    canvas { display: block; width: 100% !important; height: 100% !important; touch-action: none; }
    #hint { position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%); color: #334155; font-size: .66rem; white-space: nowrap; pointer-events: none; }
    #sidebar { background: #070f1d; border-left: 1px solid #1e293b; overflow-y: auto; padding: 12px 10px; display: flex; flex-direction: column; gap: 14px; }
    .sec-title { font-size: .6rem; font-weight: 700; letter-spacing: .14em; color: #475569; text-transform: uppercase; margin-bottom: 7px; }
    #part-list { display: flex; flex-direction: column; gap: 3px; }
    .pbtn { display: flex; align-items: center; gap: 8px; background: transparent; border: 1px solid #1e293b; color: #94a3b8; padding: 6px 10px; border-radius: 7px; cursor: pointer; text-align: left; font-size: .78rem; font-weight: 500; width: 100%; transition: all .12s; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
    .pbtn.active, .pbtn:hover { border-color: var(--c); color: #f1f5f9; background: #1e293b44; }
    .pdot { width: 7px; height: 7px; border-radius: 50%; background: var(--c); flex-shrink: 0; }
    #detail { display: none; background: #0f172a; border-radius: 10px; padding: 11px; border: 1px solid #1e293b; }
    #detail.show { display: block; }
    .dheader { display: flex; align-items: center; gap: 7px; border-left: 3px solid var(--dc); padding-left: 8px; margin-bottom: 8px; }
    .ddot { width: 9px; height: 9px; border-radius: 50%; background: var(--dc); flex-shrink: 0; }
    .dname { font-size: .88rem; font-weight: 700; color: #f1f5f9; }
    .ddesc { font-size: .76rem; color: #94a3b8; line-height: 1.6; margin-bottom: 9px; }
    .dspec { display: flex; gap: 6px; align-items: baseline; }
    .slabel { font-size: .6rem; font-weight: 700; letter-spacing: .1em; color: #475569; text-transform: uppercase; flex-shrink: 0; }
    .sval { font-size: .72rem; color: #60a5fa; font-family: monospace; }
    #mode-table { display: flex; flex-direction: column; gap: 5px; }
    .mrow { display: flex; align-items: flex-start; gap: 8px; background: #0f172a; border-radius: 7px; padding: 7px 9px; border: 1px solid #1e293b; }
    .mtag { font-size: .57rem; font-weight: 800; letter-spacing: .05em; padding: 2px 5px; border-radius: 4px; border: 1px solid; flex-shrink: 0; margin-top: 1px; }
    .mact { font-size: .74rem; color: #cbd5e1; font-weight: 600; }
    .mtrig { font-size: .66rem; color: #475569; margin-top: 2px; }
    ::-webkit-scrollbar { width: 3px; }
    ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 2px; }
    @media (max-width: 680px) {
      #main { grid-template-columns: 1fr; grid-template-rows: 1fr auto; }
      #canvas-wrap { min-height: 55vw; }
      #sidebar { border-left: none; border-top: 1px solid #1e293b; max-height: 44vh; }
    }
  </style>
</head>
<body>
<div id="app">
  <div id="header">
    <div class="title-row"><h1>TURBO HANDY</h1><span class="rev">REV.03</span></div>
    <div class="subtitle">Sound-First 설계 &middot; 터보 stututu 손선풍기 &middot; 인터랙티브 3D 모델</div>
  </div>
  <div id="view-controls">
    <button class="vbtn active" data-mode="exterior">외관</button>
    <button class="vbtn" data-mode="cross">단면</button>
    <button class="vbtn" data-mode="exploded">분해도</button>
  </div>
  <div id="main">
    <div id="canvas-wrap">
      <canvas id="c"></canvas>
      <div id="hint">드래그: 회전 &nbsp;&middot;&nbsp; 핀치: 줌 &nbsp;&middot;&nbsp; 탭: 부품 정보</div>
    </div>
    <div id="sidebar">
      <div><div class="sec-title">부품 목록</div><div id="part-list"></div></div>
      <div id="detail">
        <div class="dheader"><div class="ddot"></div><div class="dname"></div></div>
        <div class="ddesc"></div>
        <div class="dspec"><span class="slabel">사양</span><span class="sval"></span></div>
      </div>
      <div><div class="sec-title">모드 시스템</div><div id="mode-table"></div></div>
    </div>
  </div>
</div>

<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const PARTS = [
  { id:'impeller',  name:'임펠러 (BLDC)',        color:'#60a5fa', desc:'Φ40mm 8블레이드 BLDC 임펠러. 고속 회전으로 공기를 생성하고 ~2,400Hz BPF 휘슬 톤 발생. ESC를 통해 트리거 각도에 비례하여 PWM 제어.', spec:'A2212 2450KV · 최대 ~25,000RPM' },
  { id:'chopper',   name:'Chopper 디스크 (N20)', color:'#f59e0b', desc:'N20 모터 3슬릿 디스크. 임펠러 뒤에서 공기를 15Hz로 끊어 "stututu" 리듬 생성. 슬릿 수 × RPM ÷ 60 = Hz.', spec:'N20 모터 · 3슬릿 · 300RPM → 15Hz' },
  { id:'plenum',    name:'Plenum 챔버',           color:'#34d399', desc:'~30cm³ 밀폐 공간. Chopper가 공기를 막으면 압력 충전 → 열리면 폭발 방출. 매 펄스마다 버스트 텍스처 생성.', spec:'용량 ~30cm³' },
  { id:'helmholtz', name:'헬름홀츠 공명 캐비티',   color:'#a78bfa', desc:'V=20cm³ 외벽 캐비티. BPF 톤(~2,400Hz)을 +10~15dB 증폭. PVC neck 길이로 공명 주파수 튜닝.', spec:'V=20cm³ · 증폭 +10~15dB' },
  { id:'battery',   name:'배터리 (LiPo)',          color:'#f87171', desc:'7.4V 450mAh 2S LiPo. 그립 하단 내장. USB-C 충전 포트. IPX4 방수.', spec:'7.4V 450mAh 2S · JST · USB-C' },
  { id:'mcu',       name:'MCU + ESC',             color:'#fb923c', desc:'ATtiny85(양산)/Arduino Nano(프로토). 트리거 → ESC PWM + Chopper PWM 동기 제어. Chopper 닫힘 시 임펠러 PWM 10~15% 낮춰 FM 변조.', spec:'ATtiny85 · 40A ESC' },
  { id:'trigger',   name:'아날로그 트리거',          color:'#e879f9', desc:'PS5 L2 방식. 10kΩ 가변저항으로 눌림 깊이 → RPM. 잠금 버튼으로 트리거 고정 → 선풍기 모드.', spec:'10kΩ 가변저항 · 잠금 버튼' },
  { id:'oled',      name:'OLED 디스플레이',         color:'#38bdf8', desc:'0.96" I2C OLED. RPM / Chopper Hz / 배터리 / 모드 표시. 설정 탭에서 Chopper Hz 조절.', spec:'0.96" · I2C · 128×64px' },
  { id:'intake',    name:'흡기 콘 + 허니컴 그릴',    color:'#94a3b8', desc:'이중 안전 구조. 흡기 콘(1차) + 허니컴 그릴(2차). 바요넷 마운트 탈착.', spec:'바요넷 마운트 · IPX4' },
];
const MODES = [
  { tag:'FAN MODE',  action:'Chopper OFF · 중간 RPM',        trigger:'트리거 + 잠금',     color:'#60a5fa' },
  { tag:'SPOOL UP',  action:'RPM 서서히 상승 · BPF 휘슬',     trigger:'트리거 천천히',      color:'#34d399' },
  { tag:'ANTI-LAG',  action:'고RPM + Chopper 15Hz + FM',     trigger:'Anti-Lag 버튼',     color:'#f59e0b' },
  { tag:'BOV BURST', action:'단발 버스트 + RPM 급강하',        trigger:'트리거 급격히 해제', color:'#f87171' },
];

// UI
const partListEl = document.getElementById('part-list');
const detailEl   = document.getElementById('detail');
PARTS.forEach(p => {
  const b = document.createElement('button');
  b.className='pbtn'; b.dataset.id=p.id; b.style.setProperty('--c',p.color);
  b.innerHTML=`<span class="pdot"></span>${p.name}`;
  b.addEventListener('click',()=>selectPart(p.id));
  partListEl.appendChild(b);
});
document.getElementById('mode-table').innerHTML = MODES.map(m=>
  `<div class="mrow"><span class="mtag" style="background:${m.color}22;color:${m.color};border-color:${m.color}55">${m.tag}</span><div><div class="mact">${m.action}</div><div class="mtrig">${m.trigger}</div></div></div>`
).join('');

// Three.js
const canvas = document.getElementById('c');
const wrap   = document.getElementById('canvas-wrap');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setClearColor(0x020617);
renderer.shadowMap.enabled = true;
renderer.localClippingEnabled = true;

const scene  = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(42, 1, 0.1, 100);
camera.position.set(2.2, 1.8, 3.8);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, -0.15, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 2;
controls.maxDistance = 10;
controls.update();

scene.add(new THREE.AmbientLight(0xffffff, 0.5));
const sun = new THREE.DirectionalLight(0xffffff, 1.4);
sun.position.set(4, 6, 5); sun.castShadow = true; scene.add(sun);
const fill = new THREE.DirectionalLight(0x4488ff, 0.35); fill.position.set(-4,-3,-4); scene.add(fill);
const rim  = new THREE.PointLight(0x60a5fa, 0.7, 8); rim.position.set(-1, 2, 2); scene.add(rim);

// State
let selectedId = null, viewMode = 'exterior';
const clipPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0.05); // horizontal cut, show bottom half

// Registry
const registry = {};
function reg(id, group, meshes, exVec) {
  registry[id] = { group, meshes, exVec };
  scene.add(group);
}

// Material helper
function mat(hex, o={}) {
  return new THREE.MeshStandardMaterial({
    color: new THREE.Color(hex),
    metalness: o.m ?? 0.5,
    roughness: o.r ?? 0.4,
    transparent: !!o.op,
    opacity: o.op ?? 1,
    side: o.side ?? THREE.FrontSide,
    wireframe: !!o.wire,
  });
}

// ── STATIC HOUSING ──────────────────────────────────────────────────────────
{
  const g = new THREE.Group();

  // Main round disc body (turbo housing, faces +Z toward viewer)
  const disc = new THREE.Mesh(
    new THREE.CylinderGeometry(0.72, 0.72, 0.46, 56),
    mat('#1c2d42', { m:0.68, r:0.22 })
  );
  disc.rotation.x = Math.PI / 2;
  g.add(disc);

  // Scroll volute — partial torus (~310°) wrapping around the disc
  const volute = new THREE.Mesh(
    new THREE.TorusGeometry(0.80, 0.22, 16, 60, Math.PI * 1.72),
    mat('#0e1c2c', { m:0.65, r:0.25 })
  );
  // Rotate so the gap (outlet tongue) sits at ~1 o'clock
  volute.rotation.z = Math.PI * 0.48;
  g.add(volute);

  // Scroll body fill (thicker outer ring behind volute to look solid)
  const scrollFill = new THREE.Mesh(
    new THREE.TorusGeometry(0.80, 0.14, 10, 60),
    mat('#152030', { m:0.6, r:0.3 })
  );
  scrollFill.rotation.z = 0;
  g.add(scrollFill);

  // Discharge / outlet pipe — tangential exit at upper-right
  const pipe = new THREE.Mesh(
    new THREE.CylinderGeometry(0.195, 0.195, 0.65, 18),
    mat('#0c1a28', { m:0.65, r:0.28 })
  );
  pipe.position.set(0.68, 0.85, 0);
  pipe.rotation.z = Math.PI / 2;
  g.add(pipe);
  // Pipe flange rings
  [-0.28, 0.28].forEach(ox => {
    const fl = new THREE.Mesh(
      new THREE.TorusGeometry(0.21, 0.03, 8, 20),
      mat('#0a1520', { m:0.6, r:0.35 })
    );
    fl.position.set(0.68 + ox, 0.85, 0);
    fl.rotation.y = Math.PI / 2;
    g.add(fl);
  });

  // Front face outer ring
  const fr1 = new THREE.Mesh(
    new THREE.TorusGeometry(0.64, 0.06, 14, 56),
    mat('#243d5c', { m:0.75, r:0.15 })
  );
  fr1.position.z = 0.24; g.add(fr1);

  // Front face inner ring
  const fr2 = new THREE.Mesh(
    new THREE.TorusGeometry(0.44, 0.038, 10, 40),
    mat('#1a2e46', { m:0.7, r:0.2 })
  );
  fr2.position.z = 0.235; g.add(fr2);

  // Center nose cone (bearing housing boss, front)
  const nose = new THREE.Mesh(
    new THREE.ConeGeometry(0.10, 0.18, 20),
    mat('#131e2e', { m:0.75, r:0.18 })
  );
  nose.rotation.x = -Math.PI / 2;
  nose.position.z = 0.28; g.add(nose);

  // Back cover disc
  const back = new THREE.Mesh(
    new THREE.CylinderGeometry(0.72, 0.72, 0.05, 56),
    mat('#111e2e', { m:0.6, r:0.3 })
  );
  back.rotation.x = Math.PI / 2;
  back.position.z = -0.255; g.add(back);

  // Back center stud
  const stud = new THREE.Mesh(
    new THREE.CylinderGeometry(0.09, 0.12, 0.12, 14),
    mat('#0a1420', { m:0.72, r:0.2 })
  );
  stud.rotation.x = Math.PI / 2;
  stud.position.z = -0.32; g.add(stud);

  // Grip (handle, hangs down)
  const grip = new THREE.Mesh(
    new THREE.CylinderGeometry(0.235, 0.19, 1.08, 26),
    mat('#0b1520', { m:0.38, r:0.72 })
  );
  grip.position.set(-0.05, -0.9, -0.02);
  grip.rotation.z = 0.11; g.add(grip);

  // Grip texture ridges
  for (let i = 0; i < 5; i++) {
    const ridge = new THREE.Mesh(
      new THREE.TorusGeometry(0.215, 0.015, 6, 22),
      mat('#080f1a', { m:0.35, r:0.8 })
    );
    ridge.position.set(-0.05 - Math.sin(0.11)*(i-2)*0.12, -0.62 + (i-2)*0.14 - 0.28, -0.02);
    ridge.rotation.z = 0.11; g.add(ridge);
  }

  // Grip-to-housing connector bracket
  const conn = new THREE.Mesh(
    new THREE.BoxGeometry(0.52, 0.36, 0.44),
    mat('#1a2d42', { m:0.55, r:0.4 })
  );
  conn.position.set(-0.04, -0.38, 0); g.add(conn);

  // Anti-lag button (amber, on housing body side)
  const al = new THREE.Mesh(new THREE.CylinderGeometry(0.055,0.055,0.1,12), mat('#f59e0b',{m:.5,r:.3}));
  al.position.set(0.42, 0.08, 0.4); g.add(al);

  // Lock button (gray, on grip front)
  const lk = new THREE.Mesh(new THREE.CylinderGeometry(0.045,0.045,0.1,12), mat('#475569',{m:.5,r:.4}));
  lk.rotation.x = Math.PI/2;
  lk.position.set(-0.05, -0.55, 0.26); g.add(lk);

  // Mounting bolts (cosmetic, around housing)
  for (let i = 0; i < 6; i++) {
    const ang = (i/6)*Math.PI*2 + Math.PI/6;
    const bolt = new THREE.Mesh(new THREE.CylinderGeometry(0.025,0.025,0.06,8), mat('#0a1420',{m:.8,r:.15}));
    bolt.rotation.x = Math.PI/2;
    bolt.position.set(Math.cos(ang)*0.65, Math.sin(ang)*0.65, 0.26); g.add(bolt);
  }

  scene.add(g);
}

// ── INTAKE GRILL (front face, at z=0.28+) ────────────────────────────────
{
  const g = new THREE.Group();
  const c = '#94a3b8';

  // Honeycomb grill face
  const grill = new THREE.Mesh(new THREE.CircleGeometry(0.42, 6), mat(c,{wire:true,m:.4}));
  grill.position.z = 0.32; g.add(grill);

  // Outer grill ring
  const ring = new THREE.Mesh(new THREE.TorusGeometry(0.43,0.045,12,40), mat(c,{m:.65,r:.25}));
  ring.position.z = 0.32; g.add(ring);

  // Short intake cone (flared)
  const cone = new THREE.Mesh(
    new THREE.CylinderGeometry(0.44, 0.38, 0.14, 32, 1, true),
    mat(c, { op:0.55, side:THREE.DoubleSide })
  );
  cone.rotation.x = Math.PI/2;
  cone.position.z = 0.38; g.add(cone);

  reg('intake', g, [grill, ring, cone], new THREE.Vector3(0, 0, 1.8));
}

// ── IMPELLER (compressor wheel, visible from front, spins Z) ─────────────
let impSpin;
{
  const wrapper = new THREE.Group();
  impSpin = new THREE.Group();
  impSpin.position.z = 0.16;
  wrapper.add(impSpin);

  const c = '#60a5fa';
  const meshes = [];

  // Splitter disc (base platform)
  const baseDisc = new THREE.Mesh(
    new THREE.CylinderGeometry(0.40, 0.40, 0.025, 40),
    mat(c, { m:.82, r:.16 })
  );
  baseDisc.rotation.x = Math.PI/2;
  impSpin.add(baseDisc); meshes.push(baseDisc);

  // Hub cone (tapers forward)
  const hubCone = new THREE.Mesh(
    new THREE.ConeGeometry(0.095, 0.22, 18),
    mat(c, { m:.88, r:.12 })
  );
  hubCone.rotation.x = -Math.PI/2;
  hubCone.position.z = 0.1;
  impSpin.add(hubCone); meshes.push(hubCone);

  // 8 main blades — radial in XY plane
  for (let i = 0; i < 8; i++) {
    const ang = (i/8)*Math.PI*2;
    const blade = new THREE.Mesh(
      new THREE.BoxGeometry(0.038, 0.28, 0.13),
      mat(c, { m:.78, r:.18, op:.92 })
    );
    blade.rotation.z = ang;
    blade.position.set(Math.cos(ang)*0.21, Math.sin(ang)*0.21, 0.04);
    impSpin.add(blade); meshes.push(blade);
  }

  // 8 splitter blades (shorter, offset angle)
  for (let i = 0; i < 8; i++) {
    const ang = (i/8)*Math.PI*2 + Math.PI/8;
    const blade = new THREE.Mesh(
      new THREE.BoxGeometry(0.028, 0.16, 0.10),
      mat('#4a8ed8', { m:.74, r:.2, op:.85 })
    );
    blade.rotation.z = ang;
    blade.position.set(Math.cos(ang)*0.30, Math.sin(ang)*0.30, 0.03);
    impSpin.add(blade); meshes.push(blade);
  }

  reg('impeller', wrapper, meshes, new THREE.Vector3(0, 0, 1.4));
}

// ── CHOPPER DISK ─────────────────────────────────────────────────────────
let chopSpin;
{
  const wrapper = new THREE.Group();
  chopSpin = new THREE.Group();
  wrapper.add(chopSpin);

  const c = '#f59e0b';
  const meshes = [];

  // Disk perpendicular to Z, positioned behind impeller inside housing
  const disk = new THREE.Mesh(
    new THREE.CylinderGeometry(0.36, 0.36, 0.05, 36),
    mat(c, { m:.52, r:.3 })
  );
  disk.rotation.x = Math.PI/2;
  disk.position.z = 0.0;
  chopSpin.add(disk); meshes.push(disk);

  // 3 slits
  for (let i=0;i<3;i++) {
    const ang=(i/3)*Math.PI*2;
    const slit = new THREE.Mesh(new THREE.BoxGeometry(0.14,0.15,0.07), mat('#020617',{m:.1,r:.9}));
    slit.position.set(Math.cos(ang)*0.20, Math.sin(ang)*0.20, 0);
    chopSpin.add(slit);
  }

  // N20 motor body (below disk)
  const n20 = new THREE.Mesh(new THREE.CylinderGeometry(0.06,0.06,0.36,12), mat(c,{m:.6,r:.3}));
  n20.position.set(0, -0.3, 0);
  chopSpin.add(n20); meshes.push(n20);

  reg('chopper', wrapper, meshes, new THREE.Vector3(0, 0, 0.7));
}

// ── PLENUM CHAMBER ────────────────────────────────────────────────────────
{
  const g = new THREE.Group();

// ── RAYCASTER ─────────────────────────────────────────────────────────────
const raycaster = new THREE.Raycaster();
const ndc = new THREE.Vector2();
let pdPos = null;
canvas.addEventListener('pointerdown', e => { pdPos={x:e.clientX,y:e.clientY}; });
canvas.addEventListener('pointerup', e => {
  if (!pdPos) return;
  if (Math.hypot(e.clientX-pdPos.x, e.clientY-pdPos.y) < 8) {
    const r = canvas.getBoundingClientRect();
    ndc.set(((e.clientX-r.left)/r.width)*2-1, -((e.clientY-r.top)/r.height)*2+1);
    raycaster.setFromCamera(ndc, camera);
    const hits = raycaster.intersectObjects(Object.values(registry).flatMap(x=>x.meshes));
    if (hits.length) {
      const uuid = hits[0].object.uuid;
      const found = PARTS.find(p => registry[p.id]?.meshes.some(m=>m.uuid===uuid));
      if (found) selectPart(found.id);
    }
  }
  pdPos = null;
});

// ── SELECTION ─────────────────────────────────────────────────────────────
function selectPart(id) {
  selectedId = selectedId===id ? null : id;
  document.querySelectorAll('.pbtn').forEach(b=>b.classList.toggle('active',b.dataset.id===selectedId));
  if (selectedId) {
    const p = PARTS.find(x=>x.id===selectedId);
    detailEl.style.setProperty('--dc',p.color);
    detailEl.classList.add('show');
    detailEl.querySelector('.ddot').style.background=p.color;
    detailEl.querySelector('.dname').textContent=p.name;
    detailEl.querySelector('.ddesc').textContent=p.desc;
    detailEl.querySelector('.sval').textContent=p.spec;
    detailEl.scrollIntoView({behavior:'smooth',block:'nearest'});
  } else { detailEl.classList.remove('show'); }
  PARTS.forEach(p => {
    const e = registry[p.id]; if (!e) return;
    const dim = selectedId && selectedId!==p.id;
    e.meshes.forEach(m => {
      if (m.material.wireframe) return;
      m.material.color.set(dim?'#1a2540':p.color);
      if (m.material.emissive) m.material.emissiveIntensity = dim?0:(selectedId===p.id?1.5:.7);
    });
  });
}

// ── VIEW MODE ─────────────────────────────────────────────────────────────
document.querySelectorAll('.vbtn').forEach(btn=>{
  btn.addEventListener('click',()=>{
    viewMode=btn.dataset.mode;
    document.querySelectorAll('.vbtn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    renderer.clippingPlanes = viewMode==='cross'?[clipPlane]:[];
  });
});

// ── EXPLODE ───────────────────────────────────────────────────────────────
const EX=1.5;
function tickExplode(){
  const t = viewMode==='exploded'?1:0;
  PARTS.forEach(p=>{
    const e=registry[p.id]; if(!e) return;
    const v=e.exVec;
    e.group.position.x+=(v.x*EX*t-e.group.position.x)*0.09;
    e.group.position.y+=(v.y*EX*t-e.group.position.y)*0.09;
    e.group.position.z+=(v.z*EX*t-e.group.position.z)*0.09;
  });
}

// ── RESIZE ────────────────────────────────────────────────────────────────
function resize(){
  const w=wrap.clientWidth,h=wrap.clientHeight;
  renderer.setSize(w,h,false);
  camera.aspect=w/h; camera.updateProjectionMatrix();
}
resize();
window.addEventListener('resize',resize);

// ── LOOP ──────────────────────────────────────────────────────────────────
const clock = new THREE.Clock();
(function animate(){
  requestAnimationFrame(animate);
  const dt=clock.getDelta(), t=clock.getElapsedTime();
  controls.update();
  impSpin.rotation.z  += dt*(selectedId==='impeller'?16:7);
  chopSpin.rotation.z += dt*2.5;
  screenMat.emissiveIntensity = .45+Math.sin(t*1.8)*.22;
  tickExplode();
  renderer.render(scene,camera);
})();
</script>
